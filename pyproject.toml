[project]
name = "route-optimizer"
version = "2.0.0"
description = "Route Optimizer for Deliveries API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.1"
]

[tool.vercel]
entrypoint = "api.index:app"
